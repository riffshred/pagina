<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Te Amo ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    background:linear-gradient(to bottom,#0b1026,#1b2558);
    font-family:Arial,sans-serif;
    position:relative;
}

/* =========================
   LUNA
========================= */

.moon{
    position:absolute;
    top:40px;
    right:80px;

    width:140px;
    height:140px;

    background:#fff8d6;
    border-radius:50%;

    box-shadow:
        0 0 30px #fff7b2,
        0 0 60px #fff7b2;
}

/* =========================
   TEXTO
========================= */

.message{
    position:absolute;
    top:12%;
    left:50%;
    transform:translateX(-50%);

    text-align:center;
    color:white;

    font-size:5rem;
    font-weight:bold;

    text-shadow:
        0 0 10px #ff69b4,
        0 0 20px #ff69b4,
        0 0 40px #ff1493;

    z-index:20;

    animation:heartbeat 1.5s infinite;
}

.message span{
    display:block;
    font-size:2rem;
    margin-top:10px;
}

.message small{
    display:block;
    font-size:1.1rem;
    margin-top:10px;
}

@keyframes heartbeat{
    0%,100%{
        transform:translateX(-50%) scale(1);
    }

    50%{
        transform:translateX(-50%) scale(1.05);
    }
}

/* =========================
   MARCO DE FOTOS
========================= */

.photo-frame{
    position:absolute;

    left:50%;
    top:60%;

    transform:translate(-50%,-50%);

    width:380px;
    height:500px;

    background:white;

    padding:10px;

    border-radius:30px;

    border:4px solid #ffd6ea;

    overflow:hidden;

    box-shadow:
        0 0 15px rgba(255,255,255,.9),
        0 0 30px rgba(255,182,193,.8),
        0 0 60px rgba(255,105,180,.5);

    z-index:10;
}

.slide{

    position:absolute;

    top:10px;
    left:10px;

    width:calc(100% - 20px);
    height:calc(100% - 20px);

    border-radius:20px;

    object-fit:cover;

    opacity:0;

    transition:opacity 1.5s ease-in-out;
}

.slide.active{
    opacity:1;
}

/* =========================
   ESTRELLAS
========================= */

.star{
    position:absolute;
    border-radius:50%;
    background:white;

    animation:
        twinkle 2s infinite alternate,
        floatStar 8s linear infinite;

    box-shadow:
        0 0 5px white,
        0 0 10px white,
        0 0 20px white;
}

@keyframes twinkle{
    from{
        opacity:.2;
    }

    to{
        opacity:1;
    }
}

@keyframes floatStar{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-20px);
    }
}

/* =========================
   DESTELLOS
========================= */

.sparkle{
    position:absolute;

    color:white;

    font-size:25px;

    text-shadow:
        0 0 10px white,
        0 0 20px white,
        0 0 40px white;

    animation:twinkle 1.5s infinite alternate;
}

/* =========================
   FLORES
========================= */

.flower{
    position:absolute;

    font-size:50px;

    opacity:.9;

    animation:floatFlower 8s linear infinite;
}

@keyframes floatFlower{

    from{
        transform:translateY(110vh) rotate(0deg);
    }

    to{
        transform:translateY(-130vh) rotate(360deg);
    }

}

/* =========================
   BOTON MUSICA
========================= */

#btnMusica{

    position:fixed;

    bottom:25px;
    left:50%;

    transform:translateX(-50%);

    background:linear-gradient(45deg,#ff69b4,#ff1493);

    color:white;

    border:none;

    border-radius:50px;

    padding:15px 35px;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:0 0 20px rgba(255,105,180,.8);

    transition:.3s;

    z-index:9999;
}

#btnMusica:hover{
    transform:translateX(-50%) scale(1.08);
}

#btnMusica:active{
    transform:translateX(-50%) scale(.95);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:768px){

    .message{
        font-size:3rem;
        top:8%;
    }

    .message span{
        font-size:1.5rem;
    }

    .message small{
        font-size:.9rem;
    }

    .photo-frame{

        width:260px;
        height:340px;

        top:60%;
    }

    .moon{
        width:90px;
        height:90px;
        right:20px;
    }
}

</style>
</head>

<body>

<!-- Luna -->

<div class="moon"></div>

<!-- Destellos -->

<div class="sparkle" style="top:15%;left:20%;">✦</div>
<div class="sparkle" style="top:25%;left:70%;">✦</div>
<div class="sparkle" style="top:10%;left:85%;">✦</div>
<div class="sparkle" style="top:45%;left:10%;">✦</div>
<div class="sparkle" style="top:60%;left:80%;">✦</div>

<!-- Texto -->

<div class="message">
    Te Amo ❤️
    <span>Feliz 6to Mes</span>
    <small>Gracias por estos meses conmigo</small>
</div>

<!-- Carrusel -->

<div class="photo-frame">

    <img src="IMG-20260920-WA0003.jpg" class="slide active">
    <img src="IMG_20260919_201011.jpg" class="slide">
    <img src="IMG-20260920-WA0002.jpg" class="slide">
    <img src="IMG-20261009-WA0009.jpg" class="slide">
    <img src="IMG-20261009-WA0012.jpg" class="slide">
    <img src="IMG-20261031-WA0002.jpg" class="slide">
    <img src="IMG-20260920-WA0004.jpg" class="slide">
    <img src="IMG-20261009-WA0006.jpg" class="slide">

</div>

<!-- Flores -->

<div class="flower" style="left:10%;animation-delay:0s;">🌸</div>
<div class="flower" style="left:25%;animation-delay:2s;">🌷</div>
<div class="flower" style="left:40%;animation-delay:4s;">🌹</div>
<div class="flower" style="left:60%;animation-delay:1s;">🌸</div>
<div class="flower" style="left:75%;animation-delay:3s;">🌷</div>
<div class="flower" style="left:90%;animation-delay:5s;">🌹</div>

/* Música */

<button id="btnMusica">▶️ Play</button>

<audio id="musica" loop>
    <source src="Mi forma de sentir.mp3" type="audio/mpeg">
</audio>

<script>

/* Estrellas */

for(let i=0;i<150;i++){

    const star=document.createElement("div");

    star.classList.add("star");

    const size=Math.random()*4+1;

    star.style.width=size+"px";
    star.style.height=size+"px";

    star.style.left=Math.random()*100+"vw";
    star.style.top=Math.random()*100+"vh";

    star.style.animationDelay=Math.random()*5+"s";

    document.body.appendChild(star);
}

/* Música */

const audio=document.getElementById("musica");
const btnMusica=document.getElementById("btnMusica");

btnMusica.addEventListener("click",()=>{

    if(audio.paused){
        audio.play();
        btnMusica.innerHTML="⏸️ Pause";
    }else{
        audio.pause();
        btnMusica.innerHTML="▶️ Play";
    }

});

/* Carrusel */

const slides=document.querySelectorAll(".slide");

let currentSlide=0;

setInterval(()=>{

    slides[currentSlide].classList.remove("active");

    currentSlide=(currentSlide+1)%slides.length;

    slides[currentSlide].classList.add("active");

},3000);

</script>

</body>
</html>
